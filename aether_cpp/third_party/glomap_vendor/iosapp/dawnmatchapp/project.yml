name: DawnMatchBench
options:
  bundleIdPrefix: com.kyle
  deploymentTarget:
    iOS: "16.0"
targets:
  DawnMatchBench:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        DEVELOPMENT_TEAM: 26AH7V448L
        PRODUCT_BUNDLE_IDENTIFIER: com.kyle.DawnMatchBench
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        CLANG_CXX_LIBRARY: "libc++"
        ENABLE_BITCODE: NO
        HEADER_SEARCH_PATHS:
          - "/Users/kaidongwang/Developer/aether_cpp/third_party/dawn/include"
          - "/Users/kaidongwang/Developer/aether_cpp/build-ios-device-dawn/third_party/dawn/gen/include"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "/Users/kaidongwang/Developer/aether_cpp/build-ios-device-dawn/third_party/dawn/src/dawn/native/Debug-iphoneos/libwebgpu_dawn.a"
          - "-framework CoreFoundation"
          - "-framework Foundation"
          - "-framework IOSurface"
          - "-framework QuartzCore"
          - "-framework Metal"
          - "-lobjc"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: DawnMatchBench
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
